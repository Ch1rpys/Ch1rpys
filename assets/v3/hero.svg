<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="420" viewBox="0 0 1200 420" role="img"
     aria-label="Ch1rpys — AI 应用开发 / 音乐游戏">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0c1222"/>
      <stop offset="0.55" stop-color="#080d18"/>
      <stop offset="1" stop-color="#04060c"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.18" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#6366f1" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16213a" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feFlood flood-color="#22d3ee" flood-opacity="0.5" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="g"/>
      <feMerge>
        <feMergeNode in="g"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#grid)" opacity="0.32"/>
  <rect width="1200" height="420" fill="url(#halo)"/>

  <!-- neon top rail -->
  <rect x="0" y="0" width="1200" height="3" fill="url(#neon)" opacity="0.9"/>
  <rect x="0" y="3" width="1200" height="16" fill="url(#neon)" opacity="0.13" filter="url(#soft)"/>

  <!-- HUD corner brackets -->
  <g fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5">
    <path d="M34 40h46M34 40v34"/>
    <path d="M1166 380h-46M1166 380v-34"/>
  </g>

  <!-- terminal prompt -->
  <text x="70" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#22d3ee">$</text>
  <text x="96" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="21" fill="#64748b">ssh ch1rpy@github</text>

  <!-- name -->
  <text x="66" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="96" font-weight="700"
        fill="#e2e8f0" filter="url(#glow)" letter-spacing="-1">Ch1rpys</text>

  <!-- neon underline -->
  <rect x="70" y="256" width="248" height="3" fill="url(#neon)"/>

  <!-- tagline -->
  <text x="70" y="300" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Hiragino Sans GB',sans-serif" font-size="25" fill="#cbd5e1">AI 应用开发 · 音乐游戏制作</text>

