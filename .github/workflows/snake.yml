name: Generate contribution snake animation

on:
  schedule:
    # 每 6 小时刷新一次贡献热力图
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 生成贡献热力图贪吃蛇动画（深浅两套配色）
      - name: Generate snake animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Ch1rpys
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 推到 output 分支，README 通过 raw.githubusercontent 引用
      - name: Push to output branch
        run: |
          cd dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git init -q -b output
          git add -A
          git commit -q -m "🐍 update snake animation"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
